<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Pixel Quest - 2D Adventure</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b18;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#gameWrapper{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#55c8ff;
}

canvas{
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:12px 18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
    z-index:10;
}

.hudBox{
    color:white;
    background:rgba(0,0,0,.38);
    border:1px solid rgba(255,255,255,.2);
    border-radius:14px;
    padding:8px 13px;
    backdrop-filter:blur(7px);
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    text-shadow:2px 2px 0 #000;
    font-weight:bold;
    font-size:14px;
}

#centerHud{
    display:flex;
    gap:7px;
}

#levelName{
    font-size:16px;
}

/* ================= MENU ================= */

.overlay{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
      radial-gradient(circle at center,
      rgba(40,60,120,.25),
      rgba(0,0,0,.78));
}

.panel{
    width:min(480px,92vw);
    padding:32px 24px;
    border-radius:26px;
    background:rgba(12,18,39,.94);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:
      0 30px 80px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.08);
    color:white;
    text-align:center;
}

.logo{
    font-size:clamp(38px,9vw,66px);
    font-weight:900;
    letter-spacing:-4px;
    color:#ffe15c;
    text-shadow:
      4px 4px 0 #e84b3c,
      7px 7px 0 #111;
    margin-bottom:8px;
}

.subtitle{
    color:#aeb9d8;
    margin-bottom:24px;
}

button{
    border:0;
    cursor:pointer;
    color:white;
    font-weight:bold;
    font-size:16px;
    border-radius:15px;
    padding:14px 25px;
    margin:5px;
    background:linear-gradient(135deg,#ff5d5d,#ff2e75);
    box-shadow:
      0 7px 0 #a41f45,
      0 12px 25px rgba(255,40,100,.25);
    transition:.12s;
}

button:hover{
    transform:translateY(-2px);
}

button:active{
    transform:translateY(4px);
    box-shadow:
      0 3px 0 #a41f45,
      0 7px 15px rgba(255,40,100,.25);
}

.secondary{
    background:linear-gradient(135deg,#304b80,#26345e);
    box-shadow:0 7px 0 #17213e;
}

.hidden{
    display:none!important;
}

.instructions{
    margin-top:20px;
    padding:13px;
    border-radius:14px;
    background:rgba(255,255,255,.05);
    color:#aeb9d8;
    font-size:13px;
    line-height:1.6;
}

/* ================= MOBILE CONTROLS ================= */

#mobileControls{
    position:absolute;
    bottom:18px;
    left:0;
    width:100%;
    display:none;
    justify-content:space-between;
    padding:0 18px;
    z-index:20;
    pointer-events:none;
}

.controlGroup{
    display:flex;
    gap:12px;
    pointer-events:auto;
}

.touchBtn{
    width:64px;
    height:64px;
    border-radius:20px;
    background:rgba(10,18,35,.58);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.12),
      0 7px 20px rgba(0,0,0,.3);
    color:white;
    font-size:27px;
    display:flex;
    justify-content:center;
    align-items:center;
    user-select:none;
    touch-action:none;
    margin:0;
    padding:0;
}

.touchBtn:active,
.touchBtn.active{
    background:rgba(255,255,255,.22);
    transform:scale(.93);
}

/* ================= LEVEL SCREEN ================= */

.levelComplete{
    font-size:36px;
    margin-bottom:10px;
    color:#ffe15c;
}

.scoreBig{
    font-size:26px;
    margin:15px 0;
    color:#8df4a7;
}

@media(max-width:800px){
    #mobileControls{
        display:flex;
    }

    #hud{
        padding:8px;
    }

    .hudBox{
        padding:6px 9px;
        font-size:12px;
    }

    #levelName{
        font-size:13px;
    }
}

@media(max-height:500px){
    .touchBtn{
        width:52px;
        height:52px;
        border-radius:15px;
    }

    #mobileControls{
        bottom:8px;
    }
}
</style>
</head>

<body>

<div id="gameWrapper">

<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud">

    <div class="hudBox">
        ❤️ <span id="lives">3</span>
    </div>

    <div id="centerHud">

        <div class="hudBox">
            🪙 <span id="coins">0</span>
        </div>
